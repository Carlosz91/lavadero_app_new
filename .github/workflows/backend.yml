name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'car_wash_backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'car_wash_backend/**'

jobs:
  test:
    name: Tests Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_wash_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: car_wash_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run tests
        run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '1h' }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
