services:
  mongodb:
    image: mongo:7
    container_name: carwash-mongo
    restart: unless-stopped
    # Solo accesible desde el host local (no expuesto a la red).
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-carwash}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env (ver .env.example)}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./car_wash_backend
      dockerfile: Dockerfile
    container_name: carwash-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER:-carwash}:${MONGO_PASSWORD}@mongodb:27017/car_wash?authSource=admin
      # Sin valores por defecto: si faltan, compose se niega a arrancar.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Stripe: sin ellos el checkout fallará en runtime.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_REDIRECT_HOST: ${STRIPE_REDIRECT_HOST:-http://localhost:5000}
      # SMTP para reset de contraseña (opcional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@lavadero.app}
      APP_RESET_URL: ${APP_RESET_URL:-http://localhost:3000/reset-password}
    depends_on:
      mongodb:
        condition: service_healthy
    # Contenedor endurecido: sin escritura en el FS salvo logs/tmp.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backend_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Respaldos periódicos de MongoDB (carpeta ./backups, con retención).
  backup:
    image: mongo:7
    container_name: carwash-backup
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-carwash}:${MONGO_PASSWORD}@mongodb:27017/car_wash?authSource=admin
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mongodb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carwash-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:
  backend_logs:
