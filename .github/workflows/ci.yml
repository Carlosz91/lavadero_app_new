name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + jest + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_wash_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: car_wash_backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Tests con cobertura mínima
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/car_wash_e2e
      JWT_SECRET: ci-e2e-secret-key-that-is-long-enough-0123456789
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-key-long-enough-0123456789
      RATE_LIMIT_MAX: '1000'
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      # Sin clave de Stripe de pruebas el test del checkout alojado se omite.
      SKIP_STRIPE_E2E: ${{ secrets.STRIPE_TEST_SECRET_KEY == '' && '1' || '' }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            car_wash_backend/package-lock.json
            e2e/package-lock.json
      - name: Backend
        working-directory: car_wash_backend
        run: |
          npm ci
          node scripts/seedAdmin.js admin@correo.com 'Admin@123'
          nohup node server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5000/health && break; sleep 1; done
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Reporte y logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostico
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: car_wash_backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
